workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2        # ← 关键，只写这个
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest                   # 别写 15 及以下，已全量弃用
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Build without codesign
        script: flutter build ios --release --no-codesign
      - name: Package to IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr Runner-unsigned.ipa Payload
    artifacts:
      - Runner-unsigned.ipa
